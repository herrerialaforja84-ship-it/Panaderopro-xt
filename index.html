<script>
(function(){
  const svgIcon = `<svg xmlns="http://w3.org" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#f59e0b"/><text x="256" y="340" font-size="280" text-anchor="middle">🍞</text></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon)));
  
  const linkIcon = document.createElement('link');
  linkIcon.rel = 'icon';
  linkIcon.href = iconUrl;
  document.head.appendChild(linkIcon);

  const manifest = {
    name: "PanaderoPro XT",
    short_name: "PanaderoPro",
    start_url: location.href,
    display: "standalone",
    background_color: "#121212",
    theme_color: "#f59e0b",
    icons: [
      { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
      { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
    ]
  };
  const mBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
  const mLink = document.createElement('link');
  mLink.rel = 'manifest';
  mLink.href = URL.createObjectURL(mBlob);
  document.head.appendChild(mLink);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response(''))));`;
    const swBlob = new Blob([swCode], {type: 'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
})();
</script>
<style>
